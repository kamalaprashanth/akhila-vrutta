name: Check and deploy
# Every push: unit tests, page checks, cloud tests on Firebase emulators.
# main only: deploy to a private preview address, check it, then put that exact build live,
# check the live site, and roll back automatically if the live check fails.
# To save Actions minutes: a commit that already passed the checks on its branch isn't checked again on main
# (main releases that branch run's build), and the Android app is built and tested on main only.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE: kp-akhila-vrutta
  PROJECT: akhila-vrutta
  FT: npx --yes firebase-tools@14

jobs:
  seen:
    # On main: the branch run that already checked this exact commit, if there is one.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success&per_page=20" --jq '[.workflow_runs[] | select(.name == "${{ github.workflow }}" and .head_branch != "main" and .event == "push")][0].id // empty')
          echo "run=$R" >> "$GITHUB_OUTPUT"
          [ -n "$R" ] && echo "::notice title=Checks::Already passed on its branch (run $R); releasing that build" || echo "::notice title=Checks::Not checked on a branch; checking here"

  check:
    needs: seen
    if: needs.seen.outputs.run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Cloud tests on the Firebase emulators
        timeout-minutes: 12
        run: |
          (cd functions && npm ci --no-audit --no-fund)
          printf 'ANTHROPIC_API_KEY=test-not-a-key\nALPHAVANTAGE_KEY=test-not-a-key\n' > functions/.secret.local
          AV_EMULATORS=1 AV_SELF_SDK=1 node scripts/build.mjs && node scripts/firebase-sdk.mjs dist
          $FT emulators:exec --only auth,firestore,hosting,functions --project demo-akhila-vrutta "node tests/cloud/cloud.mjs"
      - name: Production build (carrying its own Firebase SDK)
        run: AV_SELF_SDK=1 npm run build && node scripts/firebase-sdk.mjs dist
        env:
          APP_CHECK_SITE_KEY: 6Lch6zEuAAAAALR8YHNMm7kpKExb7c2uR-iWEDpt
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
          AUTH_DOMAIN: kp-akhila-vrutta.web.app
      - run: npm run test:e2e
      - name: Calculations match the planner (made-up sample)
        run: npm run test:calc
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-check
          path: test-results
          if-no-files-found: ignore

  android:
    # The Android app: built from this commit's site, tested on an emulator; on main, signed and attached
    # to a GitHub release for installing on the phone.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: The site, as the app carries it (with the Android app's App Check id and key, read from Firebase)
        run: |
          if [ -n "$SA" ]; then
            echo "$SA" > "$RUNNER_TEMP/sa0.json"; gcloud auth activate-service-account --key-file "$RUNNER_TEMP/sa0.json" -q; rm "$RUNNER_TEMP/sa0.json"
            K=$(curl -sS -H "Authorization: Bearer $(gcloud auth print-access-token)" "https://firebase.googleapis.com/v1beta1/projects/$PROJECT/androidApps/$ANDROID_APP_ID/config" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const c=JSON.parse(Buffer.from(JSON.parse(s).configFileContents,"base64"));process.stdout.write(c.client[0].api_key[0].current_key)}catch{}})')
            [ -n "$K" ] && echo "::add-mask::$K" && export ANDROID_API_KEY="$K" || echo "::warning title=App Check::Couldn't read the Android app's key; the app runs without App Check"
          fi
          AV_MOBILE=1 GOOGLE_WEB_CLIENT_ID="$(node -p 'require("./mobile/google-client.json").webClientId')" node scripts/build.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_AKHILA_VRUTTA }}
          ANDROID_APP_ID: "1:85806021255:android:ee14fc59d12561e064d622"
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
          AUTH_DOMAIN: kp-akhila-vrutta.web.app
      - name: Capacitor and the app icon
        run: |
          node tests/android/testpage.mjs build-android-test
          (cd mobile && npm ci --no-audit --no-fund)
          node mobile/prepare.mjs build-android-test --icons
          (cd mobile && npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#f7f2e8' --splashBackgroundColor '#f7f2e8' --splashBackgroundColorDark '#10201b')
      - name: Test app (Money test page with made-up data)
        run: |
          node mobile/prepare.mjs build-android-test
          (cd mobile && npx cap sync android && cd android && ./gradlew --no-daemon -q assembleDebug)
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk test.apk
      - name: The app (debug, for the emulator)
        run: |
          node mobile/prepare.mjs dist
          (cd mobile && npx cap sync android && cd android && ./gradlew --no-daemon -q assembleDebug)
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
      - name: Emulator access (and room for it)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: On an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # no Google Play services: on the CI machine they keep crashing and take the app down with them
          # (Google sign-in needs them, and isn't tested here anyway)
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node tests/android/android.mjs test test.apk && node tests/android/android.mjs app app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          path: test-results
          if-no-files-found: ignore
      - name: Signing key
        id: key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_AKHILA_VRUTTA }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file "$RUNNER_TEMP/sa.json" -q
          if ! gcloud secrets versions access latest --secret android-keystore --project "$PROJECT" > "$RUNNER_TEMP/ks.json"; then
            echo "::warning title=Android::No signing key in Secret Manager yet, so no APK release"; echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          node -e 'const fs=require("fs"), j=JSON.parse(fs.readFileSync(process.argv[1])); fs.writeFileSync(process.argv[2], Buffer.from(j.jks,"base64")); console.log("::add-mask::"+j.pass); fs.appendFileSync(process.env.GITHUB_ENV, "AV_KEYSTORE_PASS="+j.pass+"\n")' "$RUNNER_TEMP/ks.json" "$RUNNER_TEMP/ks.jks"
          rm "$RUNNER_TEMP/ks.json" "$RUNNER_TEMP/sa.json"
          echo "AV_KEYSTORE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Signed APK and Play bundle, attached to a GitHub release; the bundle to Google Play (internal testing)
        if: steps.key.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_AKHILA_VRUTTA }}
          AV_VERSION_CODE: ${{ github.run_number }}
          AV_VERSION_NAME: 1.${{ github.run_number }} (${{ github.sha }})
        run: |
          (cd mobile/android && ./gradlew --no-daemon -q assembleRelease bundleRelease)
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          AAB=mobile/android/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1
          V="1.${{ github.run_number }}"
          cp "$APK" "akhila-vrutta-$V.apk"; cp "$AAB" "akhila-vrutta-$V.aab"
          gh release create "android-$V" "akhila-vrutta-$V.apk" "akhila-vrutta-$V.aab" \
            --title "Akhila Vrutta for Android $V" --target "${{ github.sha }}" \
            --notes "Phone: open this page and tap the .apk to install (it updates the installed app). Google Play: the .aab is the same app for Play Console. Built from ${{ github.sha }}."
          rm -f "$AV_KEYSTORE"
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node scripts/play-upload.mjs "akhila-vrutta-$V.aab" "$V" || echo "::warning title=Google Play::Upload to Play failed; the GitHub release has the files."
          rm -f "$RUNNER_TEMP/sa.json"

  functions:
    # Advisor (askClaude) and price updates. Separate from the site release, so a missing key never blocks it.
    needs: [seen, check]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.seen.outputs.run != ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_AKHILA_VRUTTA }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: cd functions && npm ci --no-audit --no-fund
      - name: Deploy Cloud Functions
        run: $FT deploy --only functions --project "$PROJECT" --non-interactive --force
      - name: Check the functions are running
        run: |
          $FT functions:list --project "$PROJECT" --json > fns.json
          node -e '
            const j = require("./fns.json");
            const names = (j.result || []).map((f) => f.id || f.name?.split("/").pop());
            const want = ["askClaude", "refreshPricesNow", "refreshPrices"];
            const missing = want.filter((w) => !names.includes(w));
            console.log(`::notice title=Cloud Functions::running: ${names.join(", ")}`);
            if (missing.length) { console.log(`::error title=Cloud Functions::missing: ${missing.join(", ")}`); process.exit(1); }
          '

  preview:
    needs: [seen, check]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.seen.outputs.run != ''))
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.deploy.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          # the branch run's build when this commit was checked there
          run-id: ${{ needs.seen.outputs.run }}
          github-token: ${{ github.token }}
      - name: Deploy key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_AKHILA_VRUTTA }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Add the repository secret FIREBASE_SERVICE_ACCOUNT."; exit 1; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy to a preview address
        id: deploy
        run: |
          # Firebase allows only a few preview channels per site: every release reuses one, and the
          # numbered ones older releases made are deleted.
          $FT hosting:channel:list --site "$SITE" --project "$PROJECT" --json > ch.json || true
          node -e 'try{for(const c of require("./ch.json").result?.channels??[]){const id=c.name.split("/").pop();if(/^ci-\d+$/.test(id))console.log(id)}}catch{}' | while read -r old; do
            $FT hosting:channel:delete "$old" --site "$SITE" --project "$PROJECT" --force || true
          done
          CH="ci-preview"
          test -f dist/index.html || { echo "::error::dist has no index.html"; exit 1; }
          $FT hosting:channel:deploy "$CH" --only "$SITE" --project "$PROJECT" --expires 3d --json > deploy.json || { cat deploy.json; exit 1; }
          URL=$(node -e "const j=require('./deploy.json'); console.log(Object.values(j.result)[0].url)")
          echo "Preview: $URL"
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check the preview
        run: node tests/live/live.mjs "${{ steps.deploy.outputs.url }}" "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-preview
          path: test-results
          if-no-files-found: ignore

  release:
    needs: preview
    # always(): when the checks ran on the branch, the skipped check job would otherwise skip this too
    if: always() && needs.preview.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_AKHILA_VRUTTA }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Remember the version that is live now
        id: before
        run: |
          $FT hosting:channel:list --site "$SITE" --project "$PROJECT" --json > channels.json
          V=$(node -e "const j=require('./channels.json'); const l=(j.result.channels||j.result).find(c=>c.name.endsWith('/channels/live')); console.log(l?.release?.version?.name?.split('/').pop() ?? '')")
          echo "Live before: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Database rules
        run: $FT deploy --only firestore:rules --project "$PROJECT" --non-interactive --force
      - name: Put the checked preview build live
        run: $FT hosting:clone "$SITE:${{ needs.preview.outputs.channel }}" "$SITE:live" --project "$PROJECT"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check the live site
        id: live
        run: node tests/live/live.mjs "https://$SITE.web.app" "${{ github.sha }}"
      - name: Roll back if the live check failed
        if: failure() && steps.live.outcome == 'failure' && steps.before.outputs.version != ''
        run: |
          node scripts/release-version.mjs live "${{ steps.before.outputs.version }}"
          echo "::error::The live check failed, so the site was rolled back to the previous version."
      - name: Rehearse the rollback (releases the previous version on a throwaway preview, never on live)
        if: success() && steps.before.outputs.version != ''
        run: |
          # a fresh channel each time (an old one can have expired, and an expired channel takes no release)
          $FT hosting:channel:delete rollback-rehearsal --site "$SITE" --project "$PROJECT" --force || true
          $FT hosting:channel:create rollback-rehearsal --site "$SITE" --project "$PROJECT" --expires 1d
          node scripts/release-version.mjs rollback-rehearsal "${{ steps.before.outputs.version }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-live
          path: test-results
          if-no-files-found: ignore
